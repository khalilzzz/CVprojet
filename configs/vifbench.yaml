# Pipeline settings for the public benchmark ViF-Bench (clips of 5 s, 256 px high, 16 fps).
# python -m src.run --config configs/vifbench.yaml --dataset vifbench --max-scenes 30
seed: 0

normalize:
  fps: 16                # native rate of the benchmark; a few 24 fps generators are brought down
  short_side: 256        # native height; larger generators are brought down
  crf: 18
  preset: medium

frames:
  skip_s: 0.5            # image-to-video clips start on the real frame
  duration_s: 4.5
  crop_bottom: 0.10      # same crop for every video (visible watermarks)
  crop_top: 0.0

v1:
  deltas: [1, 2, 4, 8, 16, 32]            # frame gaps at 16 fps (32 = 2 s)
  stride: 3
  min_matches: 16
  matching:
    n_features: 2000
    grid: [6, 6]
    ratio: 0.75
    mutual: true
  fundamental:
    normalization: course
    threshold_px: 1.0    # frames are about 3 times smaller than our 720p clips
    p: 0.99
    max_iters: 3000
  homography:
    threshold_px: 2.0
    p: 0.99
    max_iters: 1500
  three_view:
    gaps: [3, 8, 16]
    stride: 4
    threshold_px: 1.5
    max_iters: 800

i1:                      # frequency fingerprint of the noise residual (Sessions 1-2)
  n_frames: 16           # frames spread over the clip; their log spectra are averaged
  crop: 256              # central square used for the FFT (px)
  n_bins: 24             # radial profile bins between 0 and 0.5 cycles/pixel
  median_ksize: 3        # residual = frame - median filter

v3:                      # temporal coherence by optical flow (Session 6)
  stride: 2              # a pair (t, t+1) every `stride` frames
  max_pairs: 30

v5:                      # V5: rigid flow with learned depth (outside the course: Longuet-Higgins 1980 + Depth Anything V2)
  gap: 6               # frame pairs (t, t + gap); the residual of a slow deformation grows with the gap
  n_pairs: 6             # pairs spread over the clip
  short_side: 256        # frames are reduced to this short side before flow and depth (speed)
  focal_factor: 0.8      # ASSUMED focal length = 0.8 x the longest side (as in I2)
  texture_quantile: 0.6  # only the 40 % most textured pixels enter the fit
  iters: 5               # IRLS rounds
  max_px: 30000          # pixels used by the fit
  bad_px: 1.0            # residual above this = pixel off the rigid-camera model
  duplicate_diff: 0.3    # pairs of near-identical frames are skipped
  model: depth-anything/Depth-Anything-V2-Small-hf

i2:                      # vanishing points over time (Sessions 1-4, Grab-3D cue)
  stride: 1              # every frame (16 per second)
  max_frames: 48         # 3 s
  min_len_frac: 0.05     # segments at least 5 % of the image diagonal (about 26 px)
  max_segments: 200
  min_segments: 12
  n_vps: 3
  angle_deg: 2.5         # short segments of small frames: noisier directions
  min_inliers: 6
  max_iters: 1000
  focal_factor: 0.8
  max_jump_deg: 6.0
  min_track_len: 5
  seed: 0

clip:                    # deep learning baseline (Session 5), with --features ...,clip
  model: ViT-B-32-quickgelu   # the architecture the OpenAI weights were trained with
  pretrained: openai
  n_frames: 8

classify:                # src/models/classify.py
  n_splits: 5            # folds grouped by scene
  unseen_generator: true # also test each generator when it is left out of training

robustness:              # python -m src.eval.robustness (experiment 3), applied to the normalized clips
  levels:
    - {name: clean}                      # the normalized clip itself (CRF 18)
    - {name: crf28, crf: 28}
    - {name: crf35, crf: 35}
    - {name: half, scale: 0.5}           # width and height / 2, CRF 18
    - {name: half_crf35, scale: 0.5, crf: 35}

run:
  workers: 8
