# Whole pipeline (python -m src.run). Same parameters for real and generated media.
seed: 0

normalize:               # CLAUDE.md section 6, written to data/processed/videos/
  fps: 24
  short_side: 720        # downscale only, never upscale
  crf: 18                # H.264 quality, identical for every video
  preset: medium

frames:                  # how the normalized clips are read
  skip_s: 0.5            # drop the first 0.5 s (real first frame in image-to-video)
  duration_s: 6.0        # keep at most 6 s after the skip
  crop_bottom: 0.10      # same crop for every video (visible watermarks)
  crop_top: 0.0

v1:                      # epipolar geometry between frames
  deltas: [1, 2, 5, 10, 20, 48, 72, 96]   # frame gaps at 24 fps (96 = 4 s)
  stride: 4              # a new pair starts every `stride` frames
  min_matches: 16
  matching:
    n_features: 4000
    grid: [8, 8]         # keypoints are spread over a grid (quota per cell)
    ratio: 0.75          # Lowe ratio test (course EP3 slide 51)
    mutual: true         # keep a match only if it is the nearest neighbour both ways
  fundamental:
    normalization: course
    threshold_px: 1.5    # Sampson distance (a 1D distance)
    p: 0.99
    max_iters: 5000
  homography:
    threshold_px: 3.0    # symmetric transfer error (a 2D distance, hence 2 x 1.5)
    p: 0.99
    max_iters: 2000
  three_view:            # triangulate from frames (t, t+k), check in frame t+2k (Session 7)
    gaps: [5, 12, 24]    # k, in frames
    stride: 6
    threshold_px: 2.0    # reprojection error
    max_iters: 1000

i1:                      # frequency fingerprint of the noise residual (Sessions 1-2)
  n_frames: 16           # frames spread over the clip; their log spectra are averaged
  crop: 512              # central square used for the FFT (px)
  n_bins: 24             # radial profile bins between 0 and 0.5 cycles/pixel
  median_ksize: 3        # residual = frame - median filter

v3:                      # temporal coherence by optical flow (Session 6)
  stride: 3              # a pair (t, t+1) every `stride` frames
  max_pairs: 30

v5:                      # V5: rigid flow with learned depth (outside the course: Longuet-Higgins 1980 + Depth Anything V2)
  gap: 8               # frame pairs (t, t + gap); the residual of a slow deformation grows with the gap
  n_pairs: 6             # pairs spread over the clip
  short_side: 360        # frames are reduced to this short side before flow and depth (speed)
  focal_factor: 0.8      # ASSUMED focal length = 0.8 x the longest side (as in I2)
  texture_quantile: 0.6  # only the 40 % most textured pixels enter the fit
  iters: 5               # IRLS rounds
  max_px: 30000          # pixels used by the fit
  bad_px: 1.0            # residual above this = pixel off the rigid-camera model
  duplicate_diff: 0.3    # pairs of near-identical frames are skipped
  model: depth-anything/Depth-Anything-V2-Small-hf

i2:                      # vanishing points over time (Sessions 1-4, Grab-3D cue)
  stride: 2              # one frame in 2 (12 per second)
  max_frames: 48         # 4 s
  min_len_frac: 0.04     # segments at least 4 % of the image diagonal
  max_segments: 300      # longest ones
  min_segments: 12       # fewer segments: no VP in this frame
  n_vps: 3
  angle_deg: 2.0         # RANSAC inlier threshold: segment direction vs direction to the VP
  min_inliers: 6
  max_iters: 1000
  focal_factor: 0.8      # ASSUMED focal length = 0.8 x the longest side (about 64 degrees wide)
  max_jump_deg: 6.0      # largest change of one 3D direction between two sampled frames
  min_track_len: 5       # directions followed at least 5 sampled frames enter the pair test
  seed: 0

clip:                    # deep learning baseline (Session 5), with --features ...,clip
  model: ViT-B-32-quickgelu   # the architecture the OpenAI weights were trained with
  pretrained: openai
  n_frames: 8

classify:                # src/models/classify.py
  n_splits: 5            # folds grouped by scene
  unseen_generator: true # also test each generator when it is left out of training

robustness:              # python -m src.eval.robustness (experiment 3), applied to the normalized clips
  levels:
    - {name: clean}                      # the normalized clip itself (CRF 18)
    - {name: crf28, crf: 28}
    - {name: crf35, crf: 35}
    - {name: half, scale: 0.5}           # width and height / 2, CRF 18
    - {name: half_crf35, scale: 0.5, crf: 35}

inspect:                 # python -m src.eval.inspect_video
  reference: ""          # features.csv of a run made with THIS config (real clips = reference)

run:
  workers: 6             # videos processed in parallel
